kind = "web"
previewPath = "/chat/"
title = "Nafsih Companion Chat"
version = "1.0.0"
id = "artifacts/nafsih-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/chat/" ]
localPort = 21325

[services.development]
run = "pnpm --filter @workspace/nafsih-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nafsih-chat", "run", "build" ]
publicDir = "artifacts/nafsih-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21325"
BASE_PATH = "/chat/"
